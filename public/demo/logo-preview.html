<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logo preview</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      .light {
        background: #f8fafc;
      }
      .dark {
        background: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="row light">
      <img src="/demo/logo-preview-light.svg" height="44" alt="light" />
    </div>
    <div class="row dark">
      <img src="/demo/logo-preview-dark.svg" height="44" alt="dark" />
    </div>
  </body>
</html>
